---

# tmt-reboot and reboot do not work in tmt prepare; rebooting via ansible is
# the only way to reboot a guest during the prepare step.
- name: Reboot after system-reinstall-bootc
  hosts: all
  tasks:
    - name: Reboot system to image mode
      reboot:
        reboot_timeout: 1200
        connect_timeout: 30
        pre_reboot_delay: 15

    - name: Wait for connection to become reachable/usable
      wait_for_connection:
        delay: 30
