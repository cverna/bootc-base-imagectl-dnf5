name: build

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Build each architecture on a native runner. QEMU emulation is *not*
  # usable here: the compose runs package tooling through bubblewrap, and
  # bwrap cannot create namespaces under qemu-user ("Creating new namespace
  # failed: Invalid argument"). See the same limitation in
  # https://gitlab.com/fedora/bootc/base-images/-/issues/57
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Ensure podman is available
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version

      - name: Build ${{ matrix.arch }} image
        run: |
          set -euxo pipefail
          sudo podman build \
            --arch=${{ matrix.arch }} \
            --security-opt=label=disable --cap-add=all \
            --build-arg=IMAGE_VERSION="${GITHUB_REF_NAME}" \
            -t "${IMAGE}:${GITHUB_SHA::12}-${{ matrix.arch }}" .

      - name: Lint image
        run: sudo podman run --rm --entrypoint bootc "${IMAGE}:${GITHUB_SHA::12}-${{ matrix.arch }}" container lint

      - name: Rootfs tests
        run: |
          set -euxo pipefail
          sudo podman build --arch=${{ matrix.arch }} \
            --from "${IMAGE}:${GITHUB_SHA::12}-${{ matrix.arch }}" \
            -f tests/rootfs/Dockerfile \
            -t "${IMAGE}:test-${{ matrix.arch }}" tests/rootfs

      - name: Disk install test
        run: |
          set -euxo pipefail
          sudo tests/disk/run "${IMAGE}:${GITHUB_SHA::12}-${{ matrix.arch }}"

      - name: Push arch image to GHCR
        if: github.event_name == 'push'
        run: |
          set -euxo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman push "${IMAGE}:${GITHUB_SHA::12}-${{ matrix.arch }}"

  # Assemble and push the multi-arch manifest from the per-arch images.
  manifest:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure podman is available
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create and push manifest
        run: |
          set -euxo pipefail
          sha="${GITHUB_SHA::12}"
          sudo podman manifest create "${IMAGE}:${sha}"
          for arch in amd64 arm64; do
            sudo podman manifest add "${IMAGE}:${sha}" "docker://${IMAGE}:${sha}-${arch}"
          done
          sudo podman manifest push --all "${IMAGE}:${sha}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            sudo podman manifest create "${IMAGE}:latest"
            for arch in amd64 arm64; do
              sudo podman manifest add "${IMAGE}:latest" "docker://${IMAGE}:${sha}-${arch}"
            done
            sudo podman manifest push --all "${IMAGE}:latest"
          fi
